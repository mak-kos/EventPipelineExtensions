# DB URL is supplied at runtime by @ServiceConnection on the Testcontainers Postgres.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka client beans are needed (KafkaTemplate is autowired in the service)
# but no broker is reachable in tests; the bean is replaced with a mock.
spring.kafka.bootstrap-servers=localhost:1
spring.kafka.producer.properties.max.block.ms=1
spring.kafka.producer.properties.delivery.timeout.ms=1
spring.kafka.producer.properties.request.timeout.ms=1

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

app.events.max-page-size=100
