# DB URL is supplied at runtime by @ServiceConnection on the Testcontainers Postgres.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka client beans are needed (KafkaTemplate is autowired in the service)
# but no broker is reachable in tests; the bean is replaced with a mock.
spring.kafka.bootstrap-servers=localhost:1
spring.kafka.producer.properties.max.block.ms=1
spring.kafka.producer.properties.delivery.timeout.ms=1
spring.kafka.producer.properties.request.timeout.ms=1

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

app.events.max-page-size=100

# JWT — test-only secret, separate from prod default
app.jwt.secret=dGVzdHRlc3R0ZXN0dGVzdHRlc3R0ZXN0dGVzdHRlc3Q=
app.jwt.expiration-minutes=60

app.users[0].username=admin
app.users[0].password=admin123
app.users[0].role=ADMIN
app.users[1].username=user
app.users[1].password=user123
app.users[1].role=USER
