spring.application.name=event-api

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/events
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Bounded producer timeouts: bound the worst-case time a request thread can spend waiting on Kafka.
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=15000
spring.kafka.producer.properties.delivery.timeout.ms=30000

# JSON / dates: ISO-8601 UTC
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Server
server.port=8080

# App
app.events.max-page-size=100

# JWT (DEV-ONLY DEFAULTS — override via env vars in real deployments)
# Base64 of 32 zero bytes; absolutely not for production.
app.jwt.secret=${APP_JWT_SECRET:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:60}

# Seeded users (DEV-ONLY)
app.users[0].username=${APP_USERS_0_USERNAME:admin}
app.users[0].password=${APP_USERS_0_PASSWORD:admin123}
app.users[0].role=${APP_USERS_0_ROLE:ADMIN}
app.users[1].username=${APP_USERS_1_USERNAME:user}
app.users[1].password=${APP_USERS_1_PASSWORD:user123}
app.users[1].role=${APP_USERS_1_ROLE:USER}
